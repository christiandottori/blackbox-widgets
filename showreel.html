<!DOCTYPE html><html lang="it"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BlackBox · Showreel</title>
<link rel="stylesheet" href="assets/base.css?v=6">
<style>
  .card{padding:0;align-items:stretch;justify-content:stretch;}
  .frame{position:relative;flex:1;width:100%;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);}
  .frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}
  .ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(60% 60% at 50% 42%,rgba(225,29,42,.12),transparent 62%);text-align:center;padding:20px;}
  .ph .play{width:70px;height:70px;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center;box-shadow:0 14px 40px rgba(225,29,42,.35);}
  .ph .play .tri{width:0;height:0;border-left:19px solid var(--onRed);border-top:11px solid transparent;border-bottom:11px solid transparent;margin-left:5px;}
  .ph .t{font-family:var(--hit);font-weight:800;text-transform:uppercase;font-size:17px;margin-top:16px;color:var(--ink);}
  .ph .s{font-size:12px;color:var(--muted);margin-top:6px;}
  .tag{position:absolute;top:12px;left:12px;z-index:3;font-family:var(--hit);font-weight:800;font-size:12px;
    color:var(--onRed);background:var(--red);padding:4px 10px;border-radius:100px;}
</style></head>
<body><div class="card">
  <div class="frame" id="frame">
    <div class="tag">BLACKBOX. · Showreel</div>
  </div>
</div>
<script>
/* ==== INCOLLA QUI L'URL EMBED DEL TUO SHOWREEL ====
   YouTube:  https://www.youtube.com/embed/VIDEO_ID
   Vimeo:    https://player.vimeo.com/video/VIDEO_ID
   Lascia '' per il segnaposto. */
const VIDEO = '';
/* ================================================== */
const f=document.getElementById('frame');
if(VIDEO){
  const i=document.createElement('iframe');
  i.src=VIDEO; i.allow='autoplay; fullscreen; picture-in-picture'; i.allowFullscreen=true;
  f.appendChild(i);
}else{
  const d=document.createElement('div'); d.className='ph';
  d.innerHTML='<div class="play"><div class="tri"></div></div><div class="t">Il tuo showreel</div><div class="s">Incolla l\'URL embed in cima a <b>showreel.html</b> (YouTube/Vimeo)</div>';
  f.appendChild(d);
}
</script></body></html>
