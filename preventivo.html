<!DOCTYPE html><html lang="it"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BlackBox · Preventivo a ore</title>
<link rel="stylesheet" href="assets/base.css?v=7">
<style>
  .card{align-items:flex-start;justify-content:flex-start;overflow:auto;}
  .head{display:flex;align-items:center;justify-content:space-between;width:100%;margin-bottom:14px;gap:10px;}
  .head .wm{font-size:clamp(13px,2.4vw,17px);}
  .toggle{display:flex;background:var(--field);border:1px solid var(--line);border-radius:100px;padding:3px;}
  .toggle button{background:transparent;border:none;color:var(--muted);font-family:var(--hit);font-weight:700;font-size:11px;letter-spacing:1px;padding:6px 14px;border-radius:100px;cursor:pointer;}
  .toggle button.on{background:var(--red);color:#fff;}
  .grid{display:flex;gap:14px;width:100%;}
  .col{flex:1;}
  .row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);}
  .row .l{font-size:12.5px;color:var(--ink2);}
  .row .l small{display:block;color:var(--muted);font-size:10px;margin-top:1px;}
  .row input{width:60px;background:var(--field);border:1px solid var(--line);border-radius:7px;color:var(--ink);padding:6px 8px;font-family:var(--sans);text-align:center;}
  .row input::-webkit-inner-spin-button{opacity:.4;}
  .tot{width:100%;margin-top:16px;background:var(--bg2);border:1px solid var(--line);border-radius:13px;padding:16px 18px;display:flex;align-items:baseline;justify-content:space-between;}
  .tot .t{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-weight:600;}
  .tot .big{font-family:var(--hit);font-weight:800;font-size:clamp(24px,6vw,42px);}
  .tot .big span{color:var(--red);font-size:.5em;}
  .note{font-size:10px;color:var(--faint);margin-top:10px;}
/*VSTACK*/
@media (max-width:360px){
  .grid{flex-direction:column;align-items:stretch;}
  .grid>*{flex:0 0 auto;width:100%;}
}
</style></head>
<body><div class="card"><div class="grain"></div>
  <div class="head">
    <span class="wm">BLACKBOX<span class="dot">.</span></span>
    <div class="toggle"><button id="bIT" class="on">🇮🇹 IT €</button><button id="bCH">🇨🇭 CH CHF</button></div>
  </div>
  <div class="grid">
    <div class="col" id="colA"></div>
    <div class="col" id="colB"></div>
  </div>
  <div class="tot"><span class="t">Stima totale</span><span class="big" id="out">—</span></div>
  <div class="note">Tariffe orarie indicative medio/alte (IT) e medie (CH), modificabili nell'oggetto <code>RATES</code>. IVA esclusa.</div>
</div>
<script>
/* ==== TARIFFE ORARIE — modificabili ==== */
const RATES = {
  IT: { cur:'€',   list:[['Riprese video',70],['Montaggio video',50],['Servizio fotografico',80],['Post-produzione foto',45],['Color grading',60],['Motion graphics',55]] },
  CH: { cur:'CHF', list:[['Riprese video',150],['Montaggio video',110],['Servizio fotografico',170],['Post-produzione foto',100],['Color grading',130],['Motion graphics',120]] }
};
/* ======================================= */
let country='IT'; const hours={};
function build(){
  const {cur,list}=RATES[country];
  const a=document.getElementById('colA'), b=document.getElementById('colB'); a.innerHTML=''; b.innerHTML='';
  list.forEach((it,i)=>{
    const [name,rate]=it;
    const div=document.createElement('div'); div.className='row';
    div.innerHTML='<div class="l">'+name+'<small>'+cur+' '+rate+'/h</small></div>';
    const inp=document.createElement('input'); inp.type='number'; inp.min=0; inp.value=hours[name]||0;
    inp.oninput=()=>{hours[name]=parseFloat(inp.value)||0;calc();};
    div.appendChild(inp); (i<3?a:b).appendChild(div);
  });
  calc();
}
function calc(){
  const {cur,list}=RATES[country]; let t=0;
  list.forEach(([name,rate])=>{ t+=(hours[name]||0)*rate; });
  document.getElementById('out').innerHTML=cur+' '+t.toLocaleString('it-IT');
}
document.getElementById('bIT').onclick=()=>{country='IT';document.getElementById('bIT').classList.add('on');document.getElementById('bCH').classList.remove('on');build();};
document.getElementById('bCH').onclick=()=>{country='CH';document.getElementById('bCH').classList.add('on');document.getElementById('bIT').classList.remove('on');build();};
build();
</script></body></html>
