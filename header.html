<!DOCTYPE html><html lang="it"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BlackBox · Header</title>
<link rel="stylesheet" href="assets/base.css?v=6">
<style>
  .card{align-items:center;justify-content:center;text-align:center;
    background:radial-gradient(55% 85% at 50% 50%,rgba(225,29,42,.10),transparent 70%);}
  .wm{font-family:var(--hit);font-weight:800;letter-spacing:1px;color:var(--ink);
    font-size:clamp(30px,9vw,70px);line-height:1;text-transform:uppercase;}
  .wm .dot{color:var(--red);}
  .pay{font-family:var(--hit);font-weight:700;text-transform:uppercase;
    letter-spacing:clamp(3px,1.4vw,7px);font-size:clamp(10px,2.4vw,15px);color:var(--muted);margin-top:14px;}
  .line{width:56px;height:3px;background:var(--red);margin:16px auto 0;border-radius:2px;}
  .meta{font-size:clamp(9px,1.8vw,12px);color:var(--faint);margin-top:16px;letter-spacing:1px;}
</style></head>
<body><div class="card">
  <div class="wm">BLACKBOX<span class="dot">.</span></div>
  <div class="pay">Oltre l'inquadratura.</div>
  <div class="line"></div>
  <div class="meta">CASA DI PRODUZIONE · COMO · MILANO · TICINO</div>
</div></body></html>
