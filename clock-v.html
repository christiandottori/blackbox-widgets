<!DOCTYPE html><html lang="it"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BlackBox · Orologio</title>
<link rel="stylesheet" href="assets/base.css?v=6">
<style>
  .card{align-items:center;justify-content:center;padding:clamp(14px,5vw,26px);}
  .wrap{width:100%;max-width:280px;display:flex;flex-direction:column;align-items:center;gap:16px;}
  .head{width:100%;display:flex;align-items:center;justify-content:space-between;}
  .head .wm{font-family:var(--hit);font-weight:800;font-size:13px;}
  .head .loc{font-family:var(--hit);font-weight:700;font-size:9px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;}
  .dial{position:relative;width:100%;aspect-ratio:1;}
  .dial svg{width:100%;height:100%;display:block;}
  .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;}
  .center .t{font-family:var(--hit);font-weight:800;font-size:clamp(22px,9vw,32px);letter-spacing:-.5px;line-height:1;}
  .center .t .s{color:var(--red);}
  .center .d{font-size:clamp(10px,3.5vw,12px);color:var(--muted);margin-top:6px;text-transform:capitalize;}
</style></head>
<body><div class="card"><div class="wrap">
  <div class="head"><span class="wm">BLACKBOX<span class="dot">.</span></span><span class="loc">Como · Ticino</span></div>
  <div class="dial">
    <svg viewBox="0 0 200 200">
      <circle cx="100" cy="100" r="94" fill="none" stroke="var(--line)" stroke-width="1.5"/>
      <circle cx="100" cy="100" r="80" fill="none" stroke="var(--line)" stroke-width="1"/>
      <g id="ticks"></g>
      <circle id="arc" cx="100" cy="100" r="94" fill="none" stroke="var(--red)" stroke-width="2.5"
        stroke-linecap="round" pathLength="60" transform="rotate(-90 100 100)"/>
      <line id="hh" x1="100" y1="100" x2="100" y2="58" stroke="var(--ink)" stroke-width="3.5" stroke-linecap="round"/>
      <line id="mh" x1="100" y1="100" x2="100" y2="40" stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round"/>
      <line id="sh" x1="100" y1="100" x2="100" y2="30" stroke="var(--red)" stroke-width="1.4" stroke-linecap="round"/>
      <circle cx="100" cy="100" r="3.2" fill="var(--red)"/>
    </svg>
    <div class="center"><div class="t" id="t">--:--<span class="s">:--</span></div><div class="d" id="d">—</div></div>
  </div>
</div>
<script>
const gg=['domenica','lunedì','martedì','mercoledì','giovedì','venerdì','sabato'];
const mm=['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
const p=n=>String(n).padStart(2,'0');
// tick marks
const tk=document.getElementById('ticks');
for(let i=0;i<12;i++){const a=i*30*Math.PI/180,r1=88,r2=i%3===0?78:83;
  const x1=100+r1*Math.sin(a),y1=100-r1*Math.cos(a),x2=100+r2*Math.sin(a),y2=100-r2*Math.cos(a);
  tk.innerHTML+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--line)" stroke-width="${i%3===0?2:1}"/>`;}
function hand(id,ang,len){const a=ang*Math.PI/180;const el=document.getElementById(id);
  el.setAttribute('x2',100+len*Math.sin(a));el.setAttribute('y2',100-len*Math.cos(a));}
function tick(){
  const n=new Date(),h=n.getHours(),m=n.getMinutes(),s=n.getSeconds();
  document.getElementById('t').innerHTML=p(h)+':'+p(m)+'<span class="s">:'+p(s)+'</span>';
  document.getElementById('d').textContent=gg[n.getDay()]+' '+n.getDate()+' '+mm[n.getMonth()];
  hand('hh',(h%12)*30+m*0.5,42); hand('mh',m*6+s*0.1,60); hand('sh',s*6,70);
  document.getElementById('arc').setAttribute('stroke-dasharray',(s+n.getMilliseconds()/1000).toFixed(2)+' 60');
}
tick();setInterval(tick,1000);
</script></body></html>
