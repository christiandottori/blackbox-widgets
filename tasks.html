<!DOCTYPE html><html lang="it"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BlackBox · Task</title>
<link rel="stylesheet" href="assets/base.css?v=6">
<style>
  .card{align-items:stretch;justify-content:flex-start;gap:12px;overflow:auto;padding:clamp(12px,4vw,20px);}
  .top{display:flex;align-items:center;justify-content:space-between;}
  .top .wm{font-family:var(--hit);font-weight:800;font-size:14px;text-transform:uppercase;letter-spacing:1px;}
  .top .wm .dot{color:var(--red);}
  .rst{background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;width:28px;height:28px;cursor:pointer;font-size:14px;transition:.15s;}
  .rst:hover{border-color:var(--red);color:var(--red);}
  /* tabs stile game */
  .tabs{display:flex;gap:8px;}
  .tab{flex:1;position:relative;background:var(--surface);border:1px solid var(--line);border-radius:10px;
    padding:10px;cursor:pointer;font-family:var(--hit);font-weight:800;text-transform:uppercase;
    letter-spacing:1px;font-size:12px;color:var(--muted);transition:.18s;overflow:hidden;}
  .tab .who{display:block;font-size:13px;}
  .tab .cnt{display:block;font-family:var(--sans);font-weight:600;font-size:9.5px;letter-spacing:.5px;margin-top:3px;opacity:.8;}
  .tab.on{color:var(--ink);border-color:var(--red);
    background:linear-gradient(180deg,rgba(225,29,42,.16),transparent),var(--surface);
    box-shadow:0 0 0 1px var(--red) inset,0 6px 20px rgba(225,29,42,.20);}
  .tab.on::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--red);box-shadow:0 0 10px var(--red);}
  /* lista */
  .list{display:flex;flex-direction:column;gap:7px;}
  .task{display:flex;align-items:center;gap:11px;border:1px solid var(--line);border-left:2px solid var(--line);
    border-radius:9px;padding:11px 12px;cursor:pointer;transition:border-color .15s,background .15s,transform .15s;background:var(--surface);}
  .task:hover{border-left-color:var(--red);transform:translateX(2px);background:var(--surface2);}
  .box{width:20px;height:20px;flex-shrink:0;border:2px solid var(--muted);border-radius:5px;display:flex;
    align-items:center;justify-content:center;color:transparent;font-size:12px;font-weight:900;transition:.15s;}
  .task:hover .box{border-color:var(--red);}
  .lbl{font-size:13px;line-height:1.3;}
  .lbl .cv{color:var(--red);font-family:var(--hit);font-weight:800;margin-right:6px;}
  /* completamento: bagliore rosso poi sparizione */
  .task.done{pointer-events:none;animation:done .62s cubic-bezier(.4,0,.2,1) forwards;}
  .task.done .box{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 0 14px var(--red);}
  @keyframes done{
    0%{}
    22%{box-shadow:0 0 0 1px var(--red) inset,0 0 26px rgba(225,29,42,.75);border-color:var(--red);background:rgba(225,29,42,.16);transform:none;}
    55%{opacity:1;}
    100%{opacity:0;transform:translateX(38px) scale(.94);height:0;padding-top:0;padding-bottom:0;margin:0;border-width:0;}
  }
  .empty{text-align:center;color:var(--muted);font-size:12.5px;padding:22px 0;line-height:1.7;}
  .empty .big{font-family:var(--hit);font-weight:800;color:var(--red);font-size:16px;display:block;margin-bottom:4px;}
  .foot{font-size:10px;color:var(--faint);font-family:var(--hit);letter-spacing:1px;text-transform:uppercase;}
</style></head>
<body><div class="card">
  <div class="top"><span class="wm">Task<span class="dot">.</span></span><button class="rst" id="rst" title="Ripristina completate">↺</button></div>
  <div class="tabs" id="tabs"></div>
  <div class="list" id="list"></div>
  <div class="foot" id="foot"></div>
</div>
<script>
/* ==== TASK — modifica liberamente ==== */
const PEOPLE = [
  {key:"chris", name:"Chris", tasks:[
    "Case study Montanstahl",
    "Montaggio reel Nebel",
    "Preventivo nuovo cliente",
    "Color grading spot",
    "Rispondere a MySecretCase"
  ]},
  {key:"nico", name:"Nico", tasks:[
    "Aggiornare sito cliente",
    "Setup dominio & DNS",
    "Piano editoriale settimana",
    "Backup progetti",
    "Fattura fornitore"
  ]}
];
/* ===================================== */
const KEY="bb-tasks-done-v1";
const done=new Set(JSON.parse(localStorage.getItem(KEY)||"[]"));
const save=()=>localStorage.setItem(KEY,JSON.stringify([...done]));
let cur=PEOPLE[0].key;
const id=(p,t)=>p+"::"+t;
const remaining=p=>p.tasks.filter(t=>!done.has(id(p.key,t)));

function tabs(){
  const c=document.getElementById('tabs');c.innerHTML='';
  PEOPLE.forEach(p=>{
    const b=document.createElement('div');b.className='tab'+(p.key===cur?' on':'');
    b.innerHTML='<span class="who">'+p.name+'</span><span class="cnt">'+remaining(p).length+' missioni</span>';
    b.onclick=()=>{cur=p.key;render();};
    c.appendChild(b);
  });
}
function render(){
  tabs();
  const p=PEOPLE.find(x=>x.key===cur);
  const list=document.getElementById('list');list.innerHTML='';
  const rem=remaining(p);
  if(!rem.length){ list.innerHTML='<div class="empty"><span class="big">MISSIONI COMPLETE</span>Nessuna task per '+p.name+'. 🔴</div>'; }
  rem.forEach(t=>{
    const el=document.createElement('div');el.className='task';
    el.innerHTML='<div class="box">✓</div><div class="lbl"><span class="cv">›</span>'+t+'</div>';
    el.onclick=()=>{
      el.classList.add('done');
      el.addEventListener('animationend',()=>{ done.add(id(p.key,t)); save(); render(); },{once:true});
    };
    list.appendChild(el);
  });
  document.getElementById('foot').textContent=rem.length? rem.length+' missioni rimaste · '+p.name : '';
}
document.getElementById('rst').onclick=()=>{
  const p=PEOPLE.find(x=>x.key===cur);
  p.tasks.forEach(t=>done.delete(id(p.key,t)));save();render();
};
render();
</script></body></html>
