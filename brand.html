<!DOCTYPE html><html lang="it"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BlackBox · Brand Kit</title>
<link rel="stylesheet" href="assets/base.css?v=6">
<style>
  .card{align-items:flex-start;justify-content:flex-start;overflow:auto;}
  .head{display:flex;align-items:center;justify-content:space-between;width:100%;margin-bottom:14px;}
  .head .wm{font-size:clamp(13px,2.4vw,17px);color:var(--ink);}
  .head .kick{font-size:clamp(8px,1.5vw,11px);letter-spacing:2px;}
  .sw{display:flex;gap:10px;width:100%;flex-wrap:wrap;}
  .c{flex:1;min-width:80px;border:1px solid var(--line);border-radius:11px;overflow:hidden;cursor:pointer;}
  .c .chip{height:52px;}
  .c .meta{padding:8px 10px;}
  .c .nm{font-size:10px;color:var(--ink);font-weight:600;}
  .c .hx{font-size:10px;color:var(--muted);font-family:var(--hit);letter-spacing:.5px;text-transform:uppercase;margin-top:2px;}
  .fonts{display:flex;gap:12px;width:100%;margin-top:16px;}
  .fbox{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;}
  .fbox .t{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-weight:600;}
  .fbox .big{font-family:var(--hit);font-weight:800;text-transform:uppercase;font-size:22px;margin-top:6px;color:var(--ink);}
  .fbox .body{font-family:var(--sans);font-size:13px;color:var(--ink2);margin-top:6px;line-height:1.4;}
  .fbox .nn{font-size:10px;color:var(--red);font-family:var(--hit);font-weight:700;margin-top:8px;letter-spacing:1px;}
  .toast{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);background:var(--red);color:var(--onRed);font-size:11px;font-weight:600;padding:7px 14px;border-radius:100px;opacity:0;transition:opacity .3s;}
  .toast.on{opacity:1;}
/*VSTACK*/
@media (max-width:360px){
  .fonts{flex-direction:column;align-items:stretch;}
  .fonts>*{flex:0 0 auto;width:100%;}
}
</style></head>
<body><div class="card">
  <div class="head"><span class="wm">BLACKBOX<span class="dot">.</span></span><span class="kick">Brand kit</span></div>
  <div class="sw" id="sw"></div>
  <div class="fonts">
    <div class="fbox"><div class="t">Titoli</div><div class="big">Oltre l'inquadratura</div><div class="nn">Hitmarker · 700–800</div></div>
    <div class="fbox"><div class="t">Testo</div><div class="body">Casa di produzione a 360°: video, foto, social e web sotto un'unica regia.</div><div class="nn" style="font-family:var(--sans)">Inter · 400–600</div></div>
  </div>
  <div class="toast" id="toast">Copiato ✓</div>
</div>
<script>
const COLORS=[
  ["Nero","#0A0A0B"],["Superficie","#141418"],["Rosso BlackBox","#E11D2A"],["Grigio","#8A8A92"],["Bianco","#FFFFFF"]
];
const sw=document.getElementById('sw');
COLORS.forEach(c=>{const d=document.createElement('div');d.className='c';
  d.innerHTML='<div class="chip" style="background:'+c[1]+(c[1]==='#FFFFFF'?';border-bottom:1px solid var(--line)':'')+'"></div><div class="meta"><div class="nm">'+c[0]+'</div><div class="hx">'+c[1]+'</div></div>';
  d.onclick=()=>{navigator.clipboard.writeText(c[1]);const t=document.getElementById('toast');t.textContent=c[1]+' copiato ✓';t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1100);};
  sw.appendChild(d);});
</script></body></html>
