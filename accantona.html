<!DOCTYPE html><html lang="it"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BlackBox · Accantona-tasse</title>
<link rel="stylesheet" href="assets/base.css?v=6">
<style>
  .card{align-items:flex-start;justify-content:flex-start;}
  .head{display:flex;align-items:center;justify-content:space-between;width:100%;margin-bottom:14px;gap:10px;}
  .head .wm{font-size:clamp(13px,2.4vw,17px);}
  .toggle{display:flex;background:var(--field);border:1px solid var(--line);border-radius:100px;padding:3px;}
  .toggle button{background:transparent;border:none;color:var(--muted);font-family:var(--hit);font-weight:700;font-size:11px;padding:6px 12px;border-radius:100px;cursor:pointer;}
  .toggle button.on{background:var(--red);color:#fff;}
  .fld{width:100%;}
  .fld label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-weight:600;display:block;margin-bottom:5px;}
  .fld input{width:100%;background:var(--field);border:1px solid var(--line);border-radius:10px;color:var(--ink);font-family:var(--hit);font-weight:800;font-size:clamp(22px,4.5vw,32px);padding:12px 14px;}
  .row{display:flex;gap:12px;width:100%;margin-top:14px;}
  .box{flex:1;background:var(--bg2);border:1px solid var(--line);border-radius:13px;padding:16px;}
  .box .t{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-weight:600;}
  .box .v{font-family:var(--hit);font-weight:800;font-size:clamp(24px,5.5vw,40px);line-height:1;margin-top:8px;}
  .set .v{color:var(--red);} .set{background:radial-gradient(120% 140% at 90% -20%,rgba(225,29,42,.2),transparent 55%),var(--bg2);}
  .box .s{font-size:11px;color:var(--muted);margin-top:6px;}
  .note{font-size:10px;color:var(--faint);margin-top:auto;padding-top:12px;}
/*VSTACK*/
@media (max-width:360px){
  .row{flex-direction:column;align-items:stretch;}
  .row>*{flex:0 0 auto;width:100%;}
}
</style></head>
<body><div class="card"><div class="grain"></div>
  <div class="head">
    <span class="wm">BLACKBOX<span class="dot">.</span></span>
    <div class="toggle"><button id="a5" class="on">5%</button><button id="a15">15%</button></div>
  </div>
  <div class="fld"><label>Quanto hai incassato (€)</label><input id="inc" type="number" value="2000" min="0"></div>
  <div class="row">
    <div class="box set"><div class="t">Metti da parte</div><div class="v" id="acc">—</div><div class="s" id="pct"></div></div>
    <div class="box"><div class="t">Ti resta</div><div class="v" id="net">—</div><div class="s">disponibile</div></div>
  </div>
  <div class="note">Forfettario IT (coeff. 78% · INPS 26,07% · imposta <b id="al">5%</b>). Percentuale da accantonare su ogni incasso. Stima — verifica col commercialista.</div>
</div>
<script>
const COEFF=0.78, INPS=0.2607; let ALIQ=0.05;
const eur=n=>'€'+Math.round(n).toLocaleString('it-IT');
function rate(){ const inps=COEFF*INPS; const imposta=ALIQ*(COEFF-COEFF*INPS); return inps+imposta; }
function calc(){
  const inc=parseFloat(document.getElementById('inc').value)||0;
  const r=rate(); const acc=inc*r;
  document.getElementById('acc').innerHTML=eur(acc);
  document.getElementById('pct').textContent='≈ '+Math.round(r*100)+'% dell’incasso';
  document.getElementById('net').innerHTML=eur(inc-acc);
}
document.getElementById('inc').addEventListener('input',calc);
document.getElementById('a5').onclick=()=>{ALIQ=0.05;sw('a5','a15','5%');};
document.getElementById('a15').onclick=()=>{ALIQ=0.15;sw('a15','a5','15%');};
function sw(on,off,l){document.getElementById(on).classList.add('on');document.getElementById(off).classList.remove('on');document.getElementById('al').textContent=l;calc();}
calc();
</script></body></html>
