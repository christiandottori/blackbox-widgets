name: Notion sync

on:
  schedule:
    - cron: '*/30 * * * *'   # ogni 30 minuti
  workflow_dispatch:          # + avvio manuale dal tab Actions

permissions:
  contents: write

concurrency:
  group: notion-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch Notion data
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DB_PROGETTI: 3b1c4ba256928020b796cf52594799b5
          DB_PREVENTIVI: f7d7359f40c04027b8b069037265b257
        run: node scripts/fetch-notion.mjs
      - name: Commit se cambiato
        run: |
          git config user.name "notion-sync[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add data/*.json
          git diff --staged --quiet || git commit -m "chore: sync dati Notion [skip ci]"
          git push
