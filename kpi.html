<!DOCTYPE html><html lang="it"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BlackBox · KPI</title>
<link rel="stylesheet" href="assets/base.css">
<style>
  .card{align-items:flex-start;justify-content:flex-start;}
  .head{display:flex;align-items:center;justify-content:space-between;width:100%;margin-bottom:clamp(10px,2vw,18px);}
  .head .wm{font-size:clamp(13px,2.4vw,17px);}
  .head .kick{font-size:clamp(8px,1.5vw,11px);letter-spacing:2px;}
  .row{display:flex;gap:clamp(8px,2vw,16px);width:100%;flex:1;}
  .tile{flex:1;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:clamp(12px,2.4vw,20px);display:flex;flex-direction:column;}
  .tile .t{font-size:clamp(9px,1.6vw,12px);color:var(--muted);text-transform:uppercase;letter-spacing:1.2px;font-weight:600;}
  .tile .big{font-family:var(--hit);font-weight:800;font-size:clamp(26px,6vw,50px);line-height:1;margin-top:auto;}
  .tile .sub{font-size:clamp(9px,1.5vw,12px);color:#9a9aa2;margin-top:4px;}
  .track{height:8px;background:#26262c;border-radius:100px;margin-top:12px;overflow:hidden;}
  .fill{height:100%;background:linear-gradient(90deg,var(--red),#ff5763);border-radius:100px;width:0;transition:width 1.1s cubic-bezier(.2,.7,.2,1);}
  .ringwrap{display:flex;align-items:center;gap:12px;margin-top:auto;}
  .ring{--p:0;width:clamp(52px,10vw,84px);aspect-ratio:1;border-radius:50%;flex-shrink:0;
    background:conic-gradient(var(--red) calc(var(--p)*1%),#26262c 0);
    display:flex;align-items:center;justify-content:center;}
  .ring::before{content:'';position:absolute;width:0;}
  .ring .inner{width:72%;height:72%;border-radius:50%;background:var(--bg2);display:flex;align-items:center;justify-content:center;
    font-family:var(--hit);font-weight:800;font-size:clamp(13px,2.6vw,20px);}
</style></head>
<body><div class="card"><div class="grain"></div>
  <div class="head"><span class="wm">BLACKBOX<span class="dot">.</span></span><span class="kick" id="kick">Cruscotto · 2026</span></div>
  <div class="row">
    <div class="tile">
      <div class="t">Anno 2026</div>
      <div class="ringwrap">
        <div class="ring" id="ring"><div class="inner" id="ringn">0%</div></div>
        <div><div class="big" id="yleft" style="font-size:clamp(18px,3.4vw,26px)">—</div><div class="sub">giorni rimasti</div></div>
      </div>
    </div>
    <div class="tile">
      <div class="t">Target MRR</div>
      <div class="big" id="mrr">€0</div>
      <div class="sub" id="mrrsub">su € target</div>
      <div class="track"><div class="fill" id="mrrfill"></div></div>
    </div>
    <div class="tile">
      <div class="t">Progetti attivi</div>
      <div class="big" id="proj">0</div>
      <div class="sub" id="projsub">in pipeline</div>
    </div>
  </div>
</div>
<script>
/* ==== MODIFICA QUI I TUOI NUMERI ==== */
const CFG={
  anno: 2026,
  mrrAttuale: 1200,   // € MRR attuale
  mrrTarget:  6000,   // € obiettivo
  progetti:   4       // progetti attivi
};
/* ==================================== */
const now=new Date();
const start=new Date(CFG.anno,0,1), end=new Date(CFG.anno,11,31,23,59,59);
const pct=Math.max(0,Math.min(100,Math.round((now-start)/(end-start)*100)));
const daysLeft=Math.max(0,Math.ceil((end-now)/86400000));
document.getElementById('kick').textContent='Cruscotto · '+CFG.anno;
const ring=document.getElementById('ring');
document.getElementById('ringn').textContent=pct+'%';
document.getElementById('yleft').textContent=daysLeft;
const mrrPct=Math.min(100,Math.round(CFG.mrrAttuale/CFG.mrrTarget*100));
const fmt=n=>'€'+n.toLocaleString('it-IT');
document.getElementById('mrr').textContent=fmt(CFG.mrrAttuale);
document.getElementById('mrrsub').textContent='su '+fmt(CFG.mrrTarget)+' · '+mrrPct+'%';
document.getElementById('proj').textContent=CFG.progetti;
setTimeout(()=>{ring.style.setProperty('--p',pct);document.getElementById('mrrfill').style.width=mrrPct+'%';},150);
</script></body></html>
