<!DOCTYPE html><html lang="it"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BlackBox · Prossime consegne</title>
<link rel="stylesheet" href="assets/base.css?v=5">
<style>
  .card{align-items:flex-start;justify-content:flex-start;overflow:auto;}
  .head{display:flex;align-items:center;justify-content:space-between;width:100%;margin-bottom:14px;}
  .head .wm{font-size:clamp(13px,2.4vw,17px);}
  .live{display:flex;align-items:center;gap:7px;font-family:var(--hit);font-weight:700;font-size:10px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;}
  .live .dot{width:8px;height:8px;border-radius:50%;background:var(--red);animation:pulse 2s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(225,29,42,.5)}70%{box-shadow:0 0 0 8px rgba(225,29,42,0)}100%{box-shadow:0 0 0 0 rgba(225,29,42,0)}}
  .item{display:flex;align-items:center;gap:12px;width:100%;padding:11px 0;border-bottom:1px solid var(--line);}
  .cd{flex-shrink:0;text-align:center;min-width:56px;}
  .cd .n{font-family:var(--hit);font-weight:800;font-size:26px;line-height:1;}
  .cd .u{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;}
  .info{flex:1;min-width:0;}
  .info .p{font-family:var(--hit);font-weight:700;font-size:13px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .info .c{font-size:11px;color:var(--muted);margin-top:2px;}
  .badge{flex-shrink:0;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:4px 9px;border-radius:100px;background:var(--track);color:var(--ink2);}
  .b-soon{background:rgba(225,29,42,.15);color:#ff6b73;}
  .b-over{background:var(--red);color:#fff;}
  .wait{width:100%;text-align:center;color:var(--muted);font-size:12px;margin-top:20px;line-height:1.6;}
  .foot{width:100%;font-size:10px;color:var(--faint);margin-top:12px;}
</style></head>
<body><div class="card"><div class="grain"></div>
  <div class="head"><span class="wm">BLACKBOX<span class="dot">.</span></span><span class="live"><span class="dot"></span>Prossime consegne</span></div>
  <div id="body" style="width:100%"><div class="wait">Recupero i dati dal Notion…</div></div>
</div>
<script>
const mesi=['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
function days(iso){ const t=new Date(iso+'T00:00:00'); const n=new Date(); n.setHours(0,0,0,0); return Math.round((t-n)/86400000); }
function render(list, overdue){
  let h='';
  overdue.forEach(it=>{ h+=row(it,true); });
  list.forEach(it=>{ h+=row(it,false); });
  return h;
}
function row(it,over){
  const d=days(it.date); const dd=new Date(it.date+'T00:00:00');
  const badge = over ? '<span class="badge b-over">in ritardo</span>'
              : (d<=7 ? '<span class="badge b-soon">'+dd.getDate()+' '+mesi[dd.getMonth()]+'</span>'
                      : '<span class="badge">'+dd.getDate()+' '+mesi[dd.getMonth()]+'</span>');
  const nlab = over ? Math.abs(d) : d;
  return '<div class="item"><div class="cd"><div class="n" style="'+(over?'color:var(--red)':'')+'">'+nlab+'</div><div class="u">'+(over?'gg fa':'giorni')+'</div></div>'+
         '<div class="info"><div class="p">'+(it.progetto||'—')+'</div><div class="c">'+(it.cliente||'')+' · '+(it.stato||'')+'</div></div>'+badge+'</div>';
}
async function load(){
  try{
    const d = await (await fetch('data/deadlines.json?t='+Date.now())).json();
    const body=document.getElementById('body');
    if(!d.updatedAt){ body.innerHTML='<div class="wait">In attesa della prima sincronizzazione.<br>Parte in automatico ogni 30 min.</div>'; return; }
    if(!d.items.length && !d.overdue.length){ body.innerHTML='<div class="wait">Nessuna consegna in programma. 🎬</div>'; return; }
    body.innerHTML = render(d.items, d.overdue);
  }catch(e){ document.getElementById('body').innerHTML='<div class="wait">Dati non disponibili.</div>'; }
}
load(); setInterval(load, 120000);
</script></body></html>
