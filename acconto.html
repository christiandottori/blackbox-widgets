<!DOCTYPE html><html lang="it"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BlackBox · Acconto / Saldo</title>
<link rel="stylesheet" href="assets/base.css?v=6">
<style>
  .card{align-items:flex-start;justify-content:flex-start;overflow:auto;}
  .head{display:flex;align-items:center;justify-content:space-between;width:100%;margin-bottom:14px;gap:8px;}
  .head .wm{font-size:clamp(13px,2.4vw,17px);}
  .toggle{display:flex;background:var(--field);border:1px solid var(--line);border-radius:100px;padding:3px;}
  .toggle button{background:transparent;border:none;color:var(--muted);font-family:var(--hit);font-weight:700;font-size:10.5px;padding:6px 11px;border-radius:100px;cursor:pointer;}
  .toggle button.on{background:var(--red);color:#fff;}
  .fld{width:100%;}
  .fld label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-weight:600;display:block;margin-bottom:5px;}
  .fld input{width:100%;background:var(--field);border:1px solid var(--line);border-radius:10px;color:var(--ink);font-family:var(--hit);font-weight:800;font-size:clamp(20px,4vw,28px);padding:11px 14px;}
  .mini{display:flex;justify-content:space-between;width:100%;font-size:12px;color:var(--ink2);padding:8px 2px;border-bottom:1px solid var(--line);margin-top:10px;}
  .mini span:last-child{font-family:var(--hit);font-weight:700;}
  .row{display:flex;gap:12px;width:100%;margin-top:14px;}
  .box{flex:1;background:var(--bg2);border:1px solid var(--line);border-radius:13px;padding:15px;}
  .box .t{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-weight:600;}
  .box .v{font-family:var(--hit);font-weight:800;font-size:clamp(22px,5vw,34px);margin-top:7px;} .box .v span{color:var(--red);font-size:.5em;}
/*VSTACK*/
@media (max-width:360px){
  .row{flex-direction:column;align-items:stretch;}
  .row>*{flex:0 0 auto;width:100%;}
}
</style></head>
<body><div class="card"><div class="grain"></div>
  <div class="head">
    <span class="wm">BLACKBOX<span class="dot">.</span></span>
    <div class="toggle"><button id="vIT" class="on">IVA 22%</button><button id="vCH">CH 8.1%</button><button id="v0">No IVA</button></div>
  </div>
  <div class="fld"><label>Imponibile progetto</label><input id="imp" type="number" value="2000" min="0"></div>
  <div class="mini"><span id="ivalab">IVA 22%</span><span id="iva">—</span></div>
  <div class="mini"><span>Totale con IVA</span><span id="tot">—</span></div>
  <div class="row">
    <div class="box"><div class="t">Acconto 50%</div><div class="v" id="acc">—</div></div>
    <div class="box"><div class="t">Saldo 50%</div><div class="v" id="sal">—</div></div>
  </div>
</div>
<script>
let IVA=0.22, cur='€'; const SPLIT=0.5;
const fmt=n=>cur+' '+ (Math.round(n*100)/100).toLocaleString('it-IT');
function calc(){
  const imp=parseFloat(document.getElementById('imp').value)||0;
  const iva=imp*IVA, tot=imp+iva;
  document.getElementById('iva').textContent=fmt(iva);
  document.getElementById('tot').textContent=fmt(tot);
  document.getElementById('acc').innerHTML=fmt(tot*SPLIT);
  document.getElementById('sal').innerHTML=fmt(tot*(1-SPLIT));
}
document.getElementById('imp').addEventListener('input',calc);
function pick(id,rate,cr,lab){['vIT','vCH','v0'].forEach(x=>document.getElementById(x).classList.remove('on'));document.getElementById(id).classList.add('on');IVA=rate;cur=cr;document.getElementById('ivalab').textContent=lab;calc();}
document.getElementById('vIT').onclick=()=>pick('vIT',0.22,'€','IVA 22%');
document.getElementById('vCH').onclick=()=>pick('vCH',0.081,'CHF','IVA 8.1%');
document.getElementById('v0').onclick=()=>pick('v0',0,'€','Senza IVA');
calc();
</script></body></html>
